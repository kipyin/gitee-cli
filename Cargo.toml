[package]
name = "gitee-cli-rs"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
description = "A gh-like command-line client for Gitee"
license = "MIT"
authors = ["Kip Yin <28321392+kipyin@users.noreply.github.com>"]
repository = "https://github.com/kipyin/gitee-cli"
homepage = "https://github.com/kipyin/gitee-cli"
readme = "README.md"
keywords = ["gitee", "cli", "git"]
categories = ["command-line-utilities"]
exclude = [
    ".github/**",
    ".cursor/**",
    "docs/agents/**",
    "AGENTS.md",
]

[[bin]]
name = "gitee"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "7"
tabled = "0.22"
url = "2"
keyring = "4"
jaq-core = "3"
jaq-std = "3"
jaq-json = { version = "2", features = ["serde"] }

base64 = "0.23"
shell-words = "1"
open = "5"
inquire = "0.9.4"
tempfile = "3.27.0"
semver = "1.0.28"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
mockito = "1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/gitee-{ target }-v{ version }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "gitee-{ target }-v{ version }/{ bin }{ binary-ext }"

[profile.release]
strip = true
lto = "thin"
