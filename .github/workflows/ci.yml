name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Reuses the test/clippy build. --help/--version exit in clap before any
      # API work. Point config at an empty dir instead of overriding HOME:
      # rustup resolves its toolchain from $HOME/.rustup.
      - name: Smoke --help and --version
        run: |
          set -euo pipefail
          export GITEE_CONFIG_DIR="$(mktemp -d)"
          unset GITEE_TOKEN
          cargo run --quiet --locked -- --help >/dev/null
          version_out="$(cargo run --quiet --locked -- --version)"
          printf '%s\n' "$version_out"
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$crate_version"
          grep -F -q -- "$crate_version" <<<"$version_out"
